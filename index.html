<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">
  <title>PDF Stamp</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      width: 100%;
      max-width: 500px;
      padding: 35px 20px;
    }
    h1 {
      text-align: center;
      margin: 0 0 30px;
      font-size: 28px;
      font-weight: 700;
      color: #111;
    }
    button {
      width: 100%;
      height: 60px;
      margin-bottom: 15px;
      border: 0;
      border-radius: 18px;
      background: #2864e8;
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      -webkit-appearance: none;
      touch-action: manipulation;
    }
    button:active {
      transform: scale(0.98);
    }
    #status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 14px;
      background: white;
      color: #333;
      text-align: center;
      font-size: 15px;
      min-height: 50px;
    }
    #pdfInfo {
      display: none;
      margin-top: 15px;
      padding: 18px;
      background: white;
      border-radius: 16px;
      text-align: center;
    }
    #pdfName {
      font-weight: 600;
      word-break: break-word;
    }
    #pdfSize {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PDF Stamp</h1>
    <button id="pasteBtn">
      Paste PDF
    </button>
    <div id="status">
      Copy a PDF file, then press Paste PDF.
    </div>
    <div id="pdfInfo">
      <div id="pdfName"></div>
      <div id="pdfSize"></div>
    </div>
  </div>
  <script>
    const pasteBtn = document.getElementById("pasteBtn");
    const status = document.getElementById("status");
    const pdfInfo = document.getElementById("pdfInfo");
    const pdfName = document.getElementById("pdfName");
    const pdfSize = document.getElementById("pdfSize");
    let pastedPDF = null;
    pasteBtn.addEventListener("click", async () => {
      try {
        if (!navigator.clipboard || !navigator.clipboard.read) {
          status.textContent =
            "Clipboard file access is not supported here.";
          return;
        }
        status.textContent = "Reading clipboard...";
        const items = await navigator.clipboard.read();
        let foundPDF = false;
        for (const item of items) {
          const pdfType = item.types.find(type =>
            type === "application/pdf"
          );
          if (!pdfType) continue;
          const blob = await item.getType(pdfType);
          pastedPDF = new File(
            [blob],
            "pasted.pdf",
            {
              type: "application/pdf"
            }
          );
          foundPDF = true;
          pdfName.textContent = pastedPDF.name;
          pdfSize.textContent =
            formatBytes(pastedPDF.size);
          pdfInfo.style.display = "block";
          status.textContent =
            "PDF pasted successfully.";
          break;
        }
        if (!foundPDF) {
          status.textContent =
            "No PDF file was found in the clipboard.";
        }
      } catch (error) {
        console.error(error);
        status.textContent =
          "Could not read the PDF from the clipboard.";
      }
    });
    function formatBytes(bytes) {
      if (bytes === 0) return "0 Bytes";
      const sizes = [
        "Bytes",
        "KB",
        "MB",
        "GB"
      ];
      const i = Math.floor(
        Math.log(bytes) / Math.log(1024)
      );
      return (
        parseFloat(
          (bytes / Math.pow(1024, i)).toFixed(2)
        ) +
        " " +
        sizes[i]
      );
    }
  </script>
</body>
</html>
