<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">
  <title>PDF Stamp</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                   "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      width: 100%;
      max-width: 500px;
      padding: 35px 20px;
    }
    h1 {
      text-align: center;
      margin: 0 0 30px;
      font-size: 28px;
      font-weight: 700;
      color: #111;
    }
    button {
      width: 100%;
      height: 60px;
      margin-bottom: 15px;
      border: 0;
      border-radius: 18px;
      background: #2864e8;
      color: white;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      -webkit-appearance: none;
      touch-action: manipulation;
    }
    button:active {
      transform: scale(0.98);
    }
    #status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 14px;
      background: white;
      color: #333;
      text-align: center;
      font-size: 15px;
      min-height: 50px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #pdfInfo {
      display: none;
      margin-top: 15px;
      padding: 18px;
      background: white;
      border-radius: 16px;
      text-align: center;
    }
    #pdfName {
      font-weight: 600;
      word-break: break-word;
    }
    #pdfSize {
      margin-top: 6px;
      color: #777;
      font-size: 14px;
    }
    /*
      Hidden paste target.
      We don't use a file input.
      This element exists only so the browser
      has a real paste target.
    */
    #pasteArea {
      position: fixed;
      left: 50%;
      bottom: 20px;
      width: calc(100% - 40px);
      max-width: 460px;
      transform: translateX(-50%);
      padding: 16px;
      background: white;
      border: 2px dashed #2864e8;
      border-radius: 16px;
      text-align: center;
      font-size: 15px;
      color: #555;
      display: none;
      z-index: 9999;
    }
    #pasteArea.active {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PDF Stamp</h1>
    <button id="pasteBtn">
      Paste PDF
    </button>
    <div id="status">
      Copy a PDF file, then press Paste PDF.
    </div>
    <div id="pdfInfo">
      <div id="pdfName"></div>
      <div id="pdfSize"></div>
    </div>
  </div>
  <!--
    Real browser paste target.
    No file picker is used.
  -->
  <div id="pasteArea" tabindex="0">
    Paste the copied PDF here
  </div>
  <script>
    const pasteBtn = document.getElementById("pasteBtn");
    const status = document.getElementById("status");
    const pdfInfo = document.getElementById("pdfInfo");
    const pdfName = document.getElementById("pdfName");
    const pdfSize = document.getElementById("pdfSize");
    const pasteArea = document.getElementById("pasteArea");
    let pastedPDF = null;
    /*
      STEP 1
      User presses Paste PDF.
      We do NOT use navigator.clipboard.read().
      We activate a real paste target instead.
    */
    pasteBtn.addEventListener("click", () => {
      pasteArea.classList.add("active");
      pasteArea.focus();
      status.textContent =
        "Paste the copied PDF here.";
    });
    /*
      STEP 2
      Real browser paste event.
      This checks clipboardData.files first.
    */
    pasteArea.addEventListener("paste", (event) => {
      event.preventDefault();
      const clipboardData = event.clipboardData;
      if (!clipboardData) {
        status.textContent =
          "Clipboard data is not available.";
        return;
      }
      /*
        Try actual files first.
      */
      const files = clipboardData.files;
      if (files && files.length > 0) {
        let pdfFile = null;
        for (const file of files) {
          if (
            file.type === "application/pdf" ||
            file.name.toLowerCase().endsWith(".pdf")
          ) {
            pdfFile = file;
            break;
          }
        }
        if (pdfFile) {
          handlePDF(pdfFile);
          return;
        }
      }
      /*
        If there is no File object,
        inspect clipboard items.
      */
      const items = clipboardData.items;
      if (items && items.length > 0) {
        for (const item of items) {
          /*
            Direct PDF item.
          */
          if (item.type === "application/pdf") {
            const file = item.getAsFile();
            if (file) {
              handlePDF(file);
              return;
            }
          }
        }
      }
      /*
        Nothing usable was provided.
      */
      status.textContent =
        "No PDF file was found in the clipboard.";
    });
    /*
      Handle the PDF once WebKit gives us a File.
    */
    function handlePDF(file) {
      pastedPDF = file;
      pdfName.textContent =
        file.name || "Copied PDF";
      pdfSize.textContent =
        formatBytes(file.size);
      pdfInfo.style.display = "block";
      status.textContent =
        "PDF pasted successfully.";
      /*
        Hide paste target after success.
      */
      pasteArea.classList.remove("active");
    }
    /*
      File size formatter.
    */
    function formatBytes(bytes) {
      if (bytes === 0) {
        return "0 Bytes";
      }
      const sizes = [
        "Bytes",
        "KB",
        "MB",
        "GB"
      ];
      const i = Math.floor(
        Math.log(bytes) / Math.log(1024)
      );
      return (
        parseFloat(
          (
            bytes /
            Math.pow(1024, i)
          ).toFixed(2)
        )
        +
        " "
        +
        sizes[i]
      );
    }
  </script>
</body>
</html>
