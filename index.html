<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
                 maximum-scale=1.0, user-scalable=no">

  <title>PDF Clipboard Test</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f7;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 500px;
      padding: 35px 20px;
    }

    h1 {
      margin: 0 0 30px;

      text-align: center;

      font-size: 28px;
      font-weight: 700;

      color: #111;
    }

    /*
      This is a REAL editable paste target.
      It is intentionally not display:none.
    */

    #pasteArea {
      width: 100%;
      min-height: 150px;

      padding: 25px;

      background: white;

      border: 2px dashed #2864e8;
      border-radius: 18px;

      outline: none;

      color: #555;

      font-size: 17px;
      text-align: center;

      display: flex;
      align-items: center;
      justify-content: center;

      -webkit-user-select: text;
      user-select: text;

      overflow: hidden;
    }

    #pasteArea:focus {
      border-style: solid;
    }

    #status {
      margin-top: 15px;

      padding: 16px;

      background: white;

      border-radius: 14px;

      color: #333;

      font-size: 15px;

      text-align: left;

      white-space: pre-wrap;
      word-break: break-word;

      min-height: 80px;
    }

    #pdfInfo {
      display: none;

      margin-top: 15px;

      padding: 18px;

      background: white;

      border-radius: 16px;

      text-align: center;
    }

    #pdfName {
      font-weight: 600;

      word-break: break-word;
    }

    #pdfSize {
      margin-top: 6px;

      color: #777;

      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>PDF Clipboard Test</h1>

    <div
      id="pasteArea"
      contenteditable="true"
      spellcheck="false"
      tabindex="0"
    >
      Tap here and paste your copied PDF
    </div>

    <div id="status">
      First copy a PDF from Files.
      Then tap the box above and choose Paste.
    </div>

    <div id="pdfInfo">

      <div id="pdfName"></div>

      <div id="pdfSize"></div>

    </div>

  </div>


  <script>

    const pasteArea =
      document.getElementById("pasteArea");

    const status =
      document.getElementById("status");

    const pdfInfo =
      document.getElementById("pdfInfo");

    const pdfName =
      document.getElementById("pdfName");

    const pdfSize =
      document.getElementById("pdfSize");


    /*
      REAL PASTE EVENT
    */

    pasteArea.addEventListener("paste", function(event) {

      /*
        Prevent Safari from inserting
        random text/content into the editor.
      */

      event.preventDefault();


      const data = event.clipboardData;


      if (!data) {

        status.textContent =
          "ERROR:\n\n" +
          "clipboardData is not available.";

        return;
      }


      /*
        Show exactly what WebKit says
        is available.
      */

      let diagnostic = "";

      diagnostic +=
        "PASTE EVENT RECEIVED\n\n";


      diagnostic +=
        "Types:\n";


      if (data.types) {

        for (const type of data.types) {

          diagnostic +=
            "• " + type + "\n";
        }

      } else {

        diagnostic +=
          "No types reported.\n";
      }


      diagnostic +=
        "\nFiles: " +
        (data.files ? data.files.length : "N/A");


      diagnostic +=
        "\nItems: " +
        (data.items ? data.items.length : "N/A");


      status.textContent =
        diagnostic;


      /*
        Check DataTransfer.files
      */

      if (data.files && data.files.length > 0) {

        for (const file of data.files) {

          diagnostic +=
            "\n\nFILE FOUND\n";

          diagnostic +=
            "Name: " +
            (file.name || "(no name)") +
            "\n";

          diagnostic +=
            "Type: " +
            (file.type || "(no type)") +
            "\n";

          diagnostic +=
            "Size: " +
            file.size +
            " bytes";


          /*
            If this is the PDF,
            keep it in memory.
          */

          if (
            file.type === "application/pdf" ||
            (
              file.name &&
              file.name
                .toLowerCase()
                .endsWith(".pdf")
            )
          ) {

            window.pastedPDF = file;


            pdfName.textContent =
              file.name || "Copied PDF";


            pdfSize.textContent =
              formatBytes(file.size);


            pdfInfo.style.display =
              "block";


            diagnostic +=
              "\n\nPDF SUCCESSFULLY RECEIVED";


            status.textContent =
              diagnostic;


            return;
          }
        }
      }


      /*
        If DataTransfer.files was empty,
        inspect DataTransfer.items.
      */

      if (data.items && data.items.length > 0) {

        diagnostic +=
          "\n\nITEM DETAILS:\n";


        for (
          let i = 0;
          i < data.items.length;
          i++
        ) {

          const item =
            data.items[i];


          diagnostic +=
            "\nItem " +
            i +
            "\n";


          diagnostic +=
            "Kind: " +
            item.kind +
            "\n";


          diagnostic +=
            "Type: " +
            item.type +
            "\n";


          /*
            Try to get a File from
            the clipboard item.
          */

          if (
            item.kind === "file"
          ) {

            const file =
              item.getAsFile();


            if (file) {

              diagnostic +=
                "File obtained!\n";


              diagnostic +=
                "Name: " +
                (file.name || "(no name)") +
                "\n";


              diagnostic +=
                "Type: " +
                (file.type || "(no type)") +
                "\n";


              diagnostic +=
                "Size: " +
                file.size +
                " bytes";


              if (
                file.type ===
                "application/pdf" ||
                (
                  file.name &&
                  file.name
                    .toLowerCase()
                    .endsWith(".pdf")
                )
              ) {

                window.pastedPDF =
                  file;


                pdfName.textContent =
                  file.name ||
                  "Copied PDF";


                pdfSize.textContent =
                  formatBytes(
                    file.size
                  );


                pdfInfo.style.display =
                  "block";


                diagnostic +=
                  "\n\nPDF SUCCESSFULLY RECEIVED";


                status.textContent =
                  diagnostic;


                return;
              }
            }
          }
        }
      }


      status.textContent =
        diagnostic +
        "\n\nNO PDF FILE WAS EXPOSED TO THE PAGE.";

    });


    function formatBytes(bytes) {

      if (bytes === 0) {
        return "0 Bytes";
      }


      const sizes = [
        "Bytes",
        "KB",
        "MB",
        "GB"
      ];


      const i =
        Math.floor(
          Math.log(bytes) /
          Math.log(1024)
        );


      return (
        parseFloat(
          (
            bytes /
            Math.pow(1024, i)
          ).toFixed(2)
        )
        +
        " "
        +
        sizes[i]
      );
    }

  </script>

</body>
</html>
